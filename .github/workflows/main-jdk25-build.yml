name: main jdk25 build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        java: [ '25' ]
    env:
      SEMGREP_APP_TOKEN: ${{secrets.SEMGREP_APP_TOKEN}} 
      SEMGREP_DEPART: 18e58e86b910e4d878730af329a559b60308b99d ##commit baseline qu'on utilise pour comparer

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7 ##ajouter une version python a notre workflow
        with:
          python-version: "3.13.5"
      
      - name: Install Semgrep
        run: python -m pip install semgrep==1.185.0
        
      - name: Login Semgrep ##se connecter pour avoir tout le package java
        run: semgrep login
        
      - name: Run Semgrep with java pack ## lancer et comparer avec la baseline fail si trouve une difference
        run: semgrep scan --config p/java --metrics off --baseline-commit ${{env.SEMGREP_DEPART}} --error

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Build with Maven
        run: mvn clean test install javadoc:aggregate -Pci -B -pl '!:tika-pipes-s3-integration-tests' "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
